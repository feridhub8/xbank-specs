schema: spec-driven

context: |
  XBank is a microservice banking project.
  Global rules: https://github.com/feridhub8/sdd-global-rules-java (local clone ~/Desktop/sdd-global-rules-java) (read first; ask on any conflict with these specs).

  Repositories:
  - All repos live side by side in the local XBank/ folder; each is a separate GitHub repo under feridhub8.
  - xbank-specs (this repo) holds OpenSpec for every XBank repo. Code repos hold code only.
  - Microservices: xbank-ms-<name> (lowercase kebab-case). Gateway: xbank-api-gateway. Infrastructure: xbank-infrastructure.

  Stack:
  - Java 25 (LTS), Spring Boot 4.x.
  - Gradle, Groovy DSL, always via ./gradlew.
  - MapStruct for mapping, Lombok. DTOs are regular classes with Lombok, not records.
  - Base package: com.xbank.<service> (for example com.xbank.account).
  - Flow: Controller -> Service -> Repository.

  Environments:
  - local (developer machine) and dev (Docker) use the dev resources; prod uses the prod resources.
  - Keycloak: one instance, realm xbankDev for local and dev, realm xbank for prod.
    Roles USER (default on registration) and ADMIN (granted by hand in Keycloak).
  - Dev resources end with "Dev"; prod names have no suffix.

  Secrets:
  - HashiCorp Vault (persistent file storage), KV v2 at secret/.
  - Path: secret/xbank/<env>/<service>, env = local | dev | prod, service = repo name without "xbank-" (for example secret/xbank/local/ms-auth).
  - No secret values in any repo; only .env.example with placeholders.

  Infrastructure (repo xbank-infrastructure, Docker only):
  - PostgreSQL, Keycloak, Vault. One folder per tool, root docker-compose.yml includes all.
  - Compose project name xbank; shared external network xbank_network.

  Not decided yet (ask before assuming): package layout inside a service, database engine and
  per-service split for XBank services, API gateway technology, inter-service communication
  and message broker.
